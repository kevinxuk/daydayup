<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>家务零花钱打卡</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #2196F3; color: white; }
    .loading h1 { font-size: 24px; margin-bottom: 20px; }
    .loading p { font-size: 14px; opacity: 0.8; }
    .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loading">
    <div class="spinner"></div>
    <h1>🧹 家务零花钱打卡</h1>
    <p>正在加载应用...</p>
  </div>
  <script src="main.dart.js" type="application/javascript"></script>
</body>
</html>
