<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配置云端同步</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 500px; width: 90%; background: white; border-radius: 16px; padding: 32px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        h1 { font-size: 24px; margin-bottom: 8px; color: #333; }
        .subtitle { color: #666; margin-bottom: 24px; }
        .step { margin-bottom: 24px; padding: 16px; background: #f5f5f5; border-radius: 8px; }
        .step-number { display: inline-block; width: 28px; height: 28px; background: #2196F3; color: white; border-radius: 50%; text-align: center; line-height: 28px; margin-right: 8px; font-weight: bold; }
        .step-title { font-weight: 600; margin-bottom: 8px; }
        .step-content { font-size: 14px; color: #666; line-height: 1.6; }
        .step-content a { color: #2196F3; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 14px; color: #333; margin-bottom: 4px; font-weight: 600; }
        .input-group input, .input-group select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #2196F3, #1976D2); color: white; }
        .btn-success { background: linear-gradient(135deg, #4CAF50, #388E3C); color: white; }
        .code-block { background: #f5f5f5; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 12px; margin: 8px 0; overflow-x: auto; white-space: pre-wrap; }
        .alert { padding: 12px; border-radius: 8px; margin: 12px 0; font-size: 14px; }
        .alert-info { background: #E3F2FD; color: #1976D2; }
        .alert-success { background: #E8F5E9; color: #2E7D32; }
        .alert-warning { background: #FFF3E0; color: #E65100; }
        .hidden { display: none; }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: #2196F3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ 配置云端同步</h1>
        <p class="subtitle">选择一种同步方式</p>
        
        <div class="step">
            <div class="step-title"><span class="step-number">1</span>本地服务器模式</div>
            <div class="step-content">
                数据存储在本地服务器，适合单设备使用<br><br>
                <button class="btn btn-primary" onclick="useLocalMode()">使用本地模式</button>
            </div>
        </div>
        
        <div class="step">
            <div class="step-title"><span class="step-number">2</span>Supabase 云端模式</div>
            <div class="step-content">
                数据存储在云端，支持多设备同步<br><br>
                
                <div class="input-group">
                    <label>Supabase URL</label>
                    <input type="text" id="supabaseUrl" placeholder="例如：https://xxxxx.supabase.co">
                </div>
                <div class="input-group">
                    <label>Anon Key</label>
                    <input type="text" id="supabaseKey" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...">
                </div>
                
                <button class="btn btn-success" onclick="saveConfig()">保存配置</button>
                
                <div class="alert alert-info" style="margin-top:12px;">
                    💡 如何获取配置？<br>
                    1. 访问 https://supabase.com<br>
                    2. 创建项目 → SQL Editor<br>
                    3. 执行建表语句<br>
                    4. Settings → API 获取配置
                </div>
            </div>
        </div>
        
        <div id="successAlert" class="alert alert-success hidden">
            ✅ 配置已保存！
        </div>
        
        <div id="errorAlert" class="alert alert-warning hidden">
            ⚠️ 配置保存失败
        </div>
        
        <div class="back-link">
            <a href="index.html">← 返回首页</a>
        </div>
    </div>
    
    <script>
        // 本地模式
        function useLocalMode() {
            localStorage.removeItem('supabaseUrl');
            localStorage.removeItem('supabaseKey');
            window.location.href = 'index.html';
        }
        
        // 保存配置
        function saveConfig() {
            const url = document.getElementById('supabaseUrl').value.trim();
            const key = document.getElementById('supabaseKey').value.trim();
            
            if (!url || !key) {
                document.getElementById('errorAlert').textContent = '⚠️ 请填写完整的配置信息';
                document.getElementById('errorAlert').classList.remove('hidden');
                return;
            }
            
            // 验证 URL 格式
            try {
                new URL(url);
            } catch (e) {
                document.getElementById('errorAlert').textContent = '⚠️ URL 格式不正确';
                document.getElementById('errorAlert').classList.remove('hidden');
                return;
            }
            
            // 保存配置
            localStorage.setItem('supabaseUrl', url);
            localStorage.setItem('supabaseKey', key);
            
            document.getElementById('successAlert').classList.remove('hidden');
            
            // 延迟跳转
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        }
        
        // 检查已有配置
        window.onload = function() {
            const savedUrl = localStorage.getItem('supabaseUrl');
            const savedKey = localStorage.getItem('supabaseKey');
            
            if (savedUrl && savedKey) {
                document.getElementById('supabaseUrl').value = savedUrl;
                document.getElementById('supabaseKey').value = savedKey;
                document.getElementById('successAlert').textContent = '✅ 已检测到已有配置';
                document.getElementById('successAlert').classList.remove('hidden');
            }
        };
    </script>
</body>
</html>
